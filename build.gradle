plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21' apply false
}

subprojects {
    apply plugin: 'java'

    group = mod_group
    version = "${mod_version}+${minecraft_version}"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    repositories {
        // Mod repositories first; Maven Central last.
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Jared (JEI)'; url = 'https://maven.blamejared.com/' }
        maven { name = 'TerraformersMC (EMI)'; url = 'https://maven.terraformersmc.com/releases/' }
        maven { name = 'Shedaniel (REI)'; url = 'https://maven.shedaniel.me/' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
}
