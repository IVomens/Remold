plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

base { archivesName = "${mod_id}-fabric" }

def common = project(':common')
sourceSets.main.java.srcDir common.file('src/main/java')
sourceSets.main.resources.srcDir common.file('src/main/resources')
sourceSets.main.java.srcDir rootProject.file('compat-rei/src/main/java')

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
    runs {
        client {
            client()
            runDir 'run/client'
        }
        server {
            server()
            runDir 'run/server'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"

    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    modLocalRuntime "dev.architectury:architectury-fabric:${architectury_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
}

processResources {
    var replaceProperties = [
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_license          : mod_license,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}
