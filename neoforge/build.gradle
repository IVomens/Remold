plugins {
    id 'net.neoforged.moddev'
}

base { archivesName = "${mod_id}-neoforge" }

// The NeoForge jar contains the common code compiled in.
def common = project(':common')
sourceSets.main.java.srcDir common.file('src/main/java')
sourceSets.main.resources.srcDir common.file('src/main/resources')

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}:api"

    // Recipe viewers in the dev client, so integrations can be tested with ./gradlew :neoforge:runClient
    // Swap the comment to test EMI instead of JEI.
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range       : minecraft_version_range,
            neoforge_version              : neoforge_version,
            neoforge_loader_version_range : neoforge_loader_version_range,
            mod_id                        : mod_id,
            mod_name                      : mod_name,
            mod_license                   : mod_license,
            mod_version                   : mod_version,
            mod_authors                   : mod_authors,
            mod_description               : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
